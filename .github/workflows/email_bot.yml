name: "Smart Email Scheduler"

on:
  schedule:
    # IST to UTC Conversion (IST is +5:30)
    
    # 1. Initial (Day 0) -> 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
    
    # 2. Follow-up 1 (Day 3) -> 11:00 AM IST = 05:30 UTC
    - cron: '30 5 * * *'
    
    # 3. Follow-up 2 (Day 6) -> 12:00 PM IST = 06:30 UTC
    - cron: '30 6 * * *'
    
    # 4. Follow-up 3, 4, 5 -> 01:00 PM IST = 07:30 UTC
    - cron: '30 7 * * *'

  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run (0-5). Leave empty for standard check.'
        required: false
        default: ''

jobs:
  send_emails:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pandas google-auth oauth2client gspread python-dotenv telegram-send
      
    - name: Create Secrets
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        # Service Account (Root)
        echo "$GCP_SA_KEY" > service_account.json
        
        # .env file (Root)
        echo "$ENV_FILE" > .env

    - name: Run Email Bot (Scheduled)
      env:
        PYTHONPATH: "."
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # 1. Always Sync first (Statelessness)
        python -m email_bot.manager --sync-only
        
        # 2. Determine Stage based on Time (Approximate)
        # Smart Scheduler logic (UTC):
        # 04:30 UTC -> Stage 0 (Initial)
        # 05:30 UTC -> Stage 1
        # 06:30 UTC -> Stage 2
        # 07:30 UTC -> Stage 3, 4, 5
        
        event_name="${{ github.event_name }}"
        current_hour=$(date -u +%H)
        current_min=$(date -u +%M)
        
        echo "Event: $event_name, Time (UTC): $current_hour:$current_min"
        
        if [ "$event_name" == "schedule" ]; then
             # SCHEDULED LOGIC
             
             if [ "$current_hour" -eq 4 ]; then
                  # 04:30 UTC -> Stage 0 (Initial)
                  echo "Triggering Stage 0 (Initial)"
                  python -m email_bot.manager --stage 0
                  
             elif [ "$current_hour" -eq 5 ]; then
                  # 05:30 UTC -> Stage 1
                  echo "Triggering Stage 1"
                  python -m email_bot.manager --stage 1
             
             elif [ "$current_hour" -eq 6 ]; then
                  # 06:30 UTC -> Stage 2
                  echo "Triggering Stage 2"
                  python -m email_bot.manager --stage 2
                  
             elif [ "$current_hour" -eq 7 ]; then
                  # 07:30 UTC -> Stage 3, 4, 5
                  echo "Triggering Stage 3, 4, 5"
                  python -m email_bot.manager --stage 3
                  python -m email_bot.manager --stage 4
                  python -m email_bot.manager --stage 5
             
             else
                  echo "Scheduled run fell outside expected windows. Doing nothing."
             fi
        
        else
             # MANUAL / DISPATCH LOGIC
             echo "Manual/Default Trigger"
             if [ "${{ github.event.inputs.stage }}" != "" ]; then
                 python -m email_bot.manager --stage ${{ github.event.inputs.stage }}
             else
                 python -m email_bot.manager
             fi
        fi
