name: "Smart Email Scheduler"

on:
  schedule:
    # IST to UTC Conversion (IST is +5:30)

    # 1. Stage 5 -> 7:30 PM IST = 14:00 UTC
    - cron: '0 14 * * *'
    
    # 1.5 Early Afternoon -> 3:00 PM IST = 09:30 UTC
    - cron: '30 9 * * *'

    # 2. Stage 0 (Initial) -> 8:30 PM IST = 15:00 UTC
    - cron: '0 15 * * *'

    # 3. Stage 1 -> 9:00 PM IST = 15:30 UTC
    - cron: '30 15 * * *'

    # 4. Stage 4 -> 9:30 PM IST = 16:00 UTC
    - cron: '0 16 * * *'

    # 5. Stage 2 -> 10:00 PM IST = 16:30 UTC
    - cron: '30 16 * * *'

    # 6. Stage 3 -> 1:30 AM IST = 20:00 UTC (Previous Day)
    - cron: '0 20 * * *'

  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run (0-5). Leave empty for standard check.'
        required: false
        default: ''

jobs:
  send_emails:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pandas google-auth oauth2client gspread python-dotenv telegram-send
      
    - name: Create Secrets
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        # Service Account (Root)
        echo "$GCP_SA_KEY" > service_account.json
        
        # .env file (Root)
        echo "$ENV_FILE" > .env

    - name: Run Email Bot (Scheduled)
      env:
        PYTHONPATH: "."
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # 1. Always Sync first (Statelessness)
        python -m email_bot.manager --sync-only
        
        # 2. Determine Stage based on Time (UTC)
        # 14:00 UTC -> Stage 5 (7:30 PM IST)
        # 15:00 UTC -> Stage 0 (8:30 PM IST)
        # 15:30 UTC -> Stage 1 (9:00 PM IST)
        # 16:00 UTC -> Stage 4 (9:30 PM IST)
        # 16:30 UTC -> Stage 2 (10:00 PM IST)
        # 20:00 UTC -> Stage 3 (1:30 AM IST)
        
        event_name="${{ github.event_name }}"
        current_hour=$(date -u +%H)
        current_min=$(date -u +%M)
        
        echo "Event: $event_name, Time (UTC): $current_hour:$current_min"
        
        if [ "$event_name" == "schedule" ]; then
             # SCHEDULED LOGIC
             
             if [ "$current_hour" -eq 14 ]; then
                  echo "Triggering Stage 5 (7:30 PM IST)"
                  python -m email_bot.manager --stage 5
                  
             elif [ "$current_hour" -eq 15 ]; then
                  if [ "$current_min" -lt 15 ]; then
                      # 15:00 UTC -> Stage 0
                      echo "Triggering Stage 0 (8:30 PM IST)"
                      python -m email_bot.manager --stage 0
                  else
                      # 15:30 UTC -> Stage 1
                      echo "Triggering Stage 1 (9:00 PM IST)"
                      python -m email_bot.manager --stage 1
                  fi
                  
             elif [ "$current_hour" -eq 16 ]; then
                  if [ "$current_min" -lt 15 ]; then
                      # 16:00 UTC -> Stage 4
                      echo "Triggering Stage 4 (9:30 PM IST)"
                      python -m email_bot.manager --stage 4
                  else
                      # 16:30 UTC -> Stage 2
                      echo "Triggering Stage 2 (10:00 PM IST)"
                      python -m email_bot.manager --stage 2
                  fi
             
             elif [ "$current_hour" -eq 20 ]; then
                  # 20:00 UTC -> Stage 3
                  echo "Triggering Stage 3 (1:30 AM IST)"
                  python -m email_bot.manager --stage 3
             
             elif [ "$current_hour" -eq 09 ]; then
                  # 09:30 UTC -> 3:00 PM IST (Early Afternoon)
                  # Good for Initial Outreach or General Catch-up
                  echo "Triggering General Run (3:00 PM IST)"
                  python -m email_bot.manager --stage 0
             
             else
                  echo "Time slot not strictly mapped. Running standard batch."
                  python -m email_bot.manager
             fi
        
        else
             # MANUAL / DISPATCH LOGIC
             echo "Manual/Default Trigger"
             if [ "${{ github.event.inputs.stage }}" != "" ]; then
                 python -m email_bot.manager --stage ${{ github.event.inputs.stage }}
             else
                 python -m email_bot.manager
             fi
        fi
