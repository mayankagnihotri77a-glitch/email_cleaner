name: "Smart Email Scheduler"

on:
  schedule:
    # IST to UTC Conversion (IST is +5:30)
    
    # 1. Initial (Day 0) -> 8:30 PM IST = 15:00 UTC
    - cron: '0 15 * * *'
    
    # 2. Follow-up 1 (Day 3) -> 9:00 PM IST = 15:30 UTC
    - cron: '30 15 * * *'
    
    # 3. Follow-up 2 (Day 6) -> 1:30 AM IST = 20:00 UTC (Previous Day)
    - cron: '0 20 * * *'
    
    # 4. Follow-up 3, 4, 5 -> 9:30 PM IST = 16:00 UTC
    - cron: '0 16 * * *'

  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run (0-5). Leave empty for standard check.'
        required: false
        default: ''

jobs:
  send_emails:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f email_cleaner/requirements.txt ]; then pip install -r email_cleaner/requirements.txt; fi
        pip install pandas google-auth oauth2client gspread python-dotenv telegram-send
      
    - name: Create Secrets
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        # Service Account
        mkdir -p email_cleaner/buzzscope_today_automation
        echo "$GCP_SA_KEY" > email_cleaner/buzzscope_today_automation/service_account.json
        echo "$GCP_SA_KEY" > email_cleaner/service_account.json
        
        # .env file (SMTP Creds)
        echo "$ENV_FILE" > email_cleaner/.env

    - name: Run Email Bot (Scheduled)
      env:
        PYTHONPATH: "email_cleaner"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        cd email_cleaner
        
        # 1. Always Sync first (Statelessness)
        python -m email_bot.manager --sync-only
        
        # 2. Determine Stage based on Time (Approximate)
        # GitHub Actions Cron is not perfectly precise, so we check time range
        # OR we just run the manager with no args?
        # Manager default run_bot() sends everything pending.
        # BUT user wanted specific stages at specific times.
        # Smart Scheduler logic:
        # 15:00 UTC -> Initial (Stage 0)
        # 15:30 UTC -> F1 (Stage 1)
        # 16:00 UTC -> F3, F4, F5 (Stage 3, 4, 5)
        # 20:00 UTC -> F2 (Stage 2)
        
        current_hour=$(date -u +%H)
        current_min=$(date -u +%M)
        
        if [ "$current_hour" -eq 15 ] && [ "$current_min" -lt 15 ]; then
             echo "Triggering Stage 0 (Initial)"
             python -m email_bot.manager --stage 0
             
        elif [ "$current_hour" -eq 15 ] && [ "$current_min" -ge 30 ]; then
             echo "Triggering Stage 1"
             python -m email_bot.manager --stage 1
             
        elif [ "$current_hour" -eq 16 ]; then
             echo "Triggering Stage 3, 4, 5"
             python -m email_bot.manager --stage 3
             python -m email_bot.manager --stage 4
             python -m email_bot.manager --stage 5
             
        elif [ "$current_hour" -eq 20 ]; then
             echo "Triggering Stage 2"
             python -m email_bot.manager --stage 2
        
        else
             echo "Manual/Default Trigger"
             if [ "${{ github.event.inputs.stage }}" != "" ]; then
                 python -m email_bot.manager --stage ${{ github.event.inputs.stage }}
             else
                 python -m email_bot.manager
             fi
        fi
