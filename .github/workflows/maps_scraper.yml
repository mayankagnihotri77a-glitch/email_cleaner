name: "Daily Maps Scraper (Active)"

on:
  schedule:
    # Run daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f email_cleaner/requirements.txt ]; then pip install -r email_cleaner/requirements.txt; fi
        pip install pandas google-auth oauth2client playwright gspread python-dotenv schedule telegram-send
        playwright install chromium
      
    - name: Create Service Account File
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        # Write secret to file
        # Ensure directories exist
        mkdir -p email_cleaner/buzzscope_today_automation
        
        echo "$GCP_SA_KEY" > email_cleaner/buzzscope_today_automation/service_account.json
        # Also put one in fallback location just in case
        echo "$GCP_SA_KEY" > email_cleaner/service_account.json

    - name: Run Maps Scraper
      env:
        PYTHONPATH: "email_cleaner"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Assuming scraper looks for sheet URL in env or default
      run: |
        # Run module
        python -m maps_scraper.maps_bot
      working-directory: email_cleaner
