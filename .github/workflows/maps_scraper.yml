name: "Daily Maps Scraper (Active)"

on:
  schedule:
    # Run daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pandas google-auth oauth2client playwright gspread python-dotenv schedule telegram-send dnspython
        playwright install chromium
      
    - name: Create Secrets
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        # Write secrets to root
        echo "$GCP_SA_KEY" > service_account.json
        echo "$ENV_FILE" > .env

    - name: Run Maps Scraper
      env:
        PYTHONPATH: "."
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Run module
        python -m maps_scraper.maps_bot

    - name: Run Auto-Cleaner
      env:
        PYTHONPATH: "."
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Run cleaner
        python run_cleaning_job.py
